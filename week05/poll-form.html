<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>Form</title>
</head>

<body>
    <header>
        <h1>WDD 130 | Form</h1>
    </header>
    <main>
        <form name="contact">
            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="text" name="useremail" id="useremail" required>
            </div>
        </form>
        <form name="questions">
            <div class="form-item column1">
                <label for="browser">What is yor favourite browser?</label>
                <select name="browser" id="browser">
                    <option value="Chrome">Chrome</option>
                    <option value="Safari">Safari</option>
                    <option value="Edge">Edge</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Brave">Brave</option>
                </select>
            </div>
            <div class="form-item column1">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" name="pet" id="pet">
            </div>
            <div class="form-item">
                <label for="feedback">List the places you have lived:</label>
                <textarea name="feedback" id="feedback" rows="5"
                  placeholder="Johannesburg South Africa, White River South Africa, Brussels Belgium"></textarea>
            </div>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>&copy;2026 | Form | Khanya Nyathikazi</p>
    </footer>
</body>

</html>
