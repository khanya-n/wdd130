<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact information of a white water rafting company. It is a family owned business situated in South Africa.">
    <meta name="author" content="Khanya Nyathikazi">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - Rapids Rafting</title>
</head>

<body>
    <header>
        <img src="images/z-rapids-trees.jpg" alt="Rafting company logo">
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1 class="page-heading">Rapids Rafting Company</h1>
        <div class="contact-info">
            <p>Pretorius Park, Plot 157 Pelindaba Rd</p>
            <p>Broederstroom, 0240</p>
            <p>+27 11 222 3334</p>
            <p>info@rapidsrafting.co.za</p>
        </div>
        <div class="map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3592.1558491363558!2d27.89380099999999!3d-25.798431999999995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sza!4v1790768344381!5m2!1sen!2sza"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </div>
        <div class="contact-form">
            <form action="#">
                <label for="name">Name</label>
                <input type="text" name="name" id="name">

                <label for="email">Email</label>
                <input type="email" name="email" id="email">

                <fieldset>
                    <legend>Message Purpose</legend>
                    <input type="radio" name="purpose" id="general">
                    <label for="general">General Inquiry</label>
                    <input type="radio" name="purpose" id="reservation">
                    <label for="reservation">Reservation Question</label>
                    <input type="radio" name="purpose" id="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea name="message" id="message"></textarea>

                <input type="checkbox" name="subscribe" id="subscribe">
                <label for="subscribe">Subscribe to the monthly newsletter?</label>

                <button type="submit">Get in Touch</button>
            </form>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="" alt="">
                <figcaption>John Appleseed - Customer Service</figcaption>
            </figure>
            <figure>
                <img src="" alt="">
                <figcaption>Bongi Barnard - IT </figcaption>
            </figure>
            <figure>
                <img src="" alt="">
                <figcaption>Molly Maple - Customer Service</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>
            &copy;2026 | Rapids Rafting | Khanya Nyathikazi
        </p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.svg" alt="LinkedIn icon">
            </a>
        </nav>
    </footer>
</body>

</html>
